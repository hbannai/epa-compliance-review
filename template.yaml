                  send(event,ctx,'SUCCESS',{})
              except Exception as e:
                  print(e)
                  send(event,ctx,'SUCCESS',{})
          def send(event,ctx,status,data):
              body=json.dumps({'Status':status,'Reason':'See CW','UniqueId':'id','StackId':event['StackId'],'RequestId':event['RequestId'],'LogicalResourceId':event['LogicalResourceId'],'PhysicalResourceId':ctx.log_stream_name,'Data':data}).encode()
