  # ===================== SNS (Optional) =====================

  ReviewNotificationTopic:
    Type: AWS::SNS::Topic
    Condition: HasNotificationEmail
    Properties:
      TopicName: !Sub '${ProjectName}-notifications'

  ReviewNotificationSub:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref ReviewNotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

Outputs:
  ApiUrl:
    Description: Base API Gateway URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod'

  WebsiteUrl:
    Description: Citizen Upload Portal URL (CloudFront)
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID (for cache invalidation)
    Value: !Ref CloudFrontDistribution

  DocumentsBucketName:
    Description: S3 bucket holding uploaded compliance documents
    Value: !Ref DocumentsBucket

  WebsiteBucketName:
    Description: S3 bucket hosting the web portal
    Value: !Ref WebsiteBucket
