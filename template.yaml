  # ===================== SNS (Optional) =====================

  ReviewNotificationTopic:
    Type: AWS::SNS::Topic
    Condition: HasNotificationEmail
    Properties:
      TopicName: !Sub '${ProjectName}-notifications'

  ReviewNotificationSub:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
