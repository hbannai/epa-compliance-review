AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EPA Office of Water - Citizen Compliance Report Submission & AI Review System.
  Uses Amazon Bedrock (Mistral) for automated compliance checking against EPA regulations.
  All Lambda code is inline - no external S3 bucket needed. Just deploy this template.
  Enhanced with: Email Notifications, AI Chatbot, Analytics Dashboard, PDF Export, Search/Filter/Assignment.

Parameters:
  ProjectName:
    Type: String
    Default: epa-compliance-review
    Description: Project name prefix for all resources

  BedrockModelId:
    Type: String
    Default: mistral.mistral-large-2402-v1:0
    Description: Bedrock model ID for Mistral

  NotificationEmail:
    Type: String
    Default: ''
    Description: Email for flagged-report notifications (leave blank to skip)

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, '']]

Resources:

  # ===================== S3 AUTO-ANALYZE (bulk upload trigger) =====================

  AutoAnalyzeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-auto-analyze'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Sub '${ProjectName}-docs-${AWS::AccountId}'
          REPORTS_TABLE: !Sub '${ProjectName}-reports'
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          EPA_PROMPT: >
            You are an EPA Office of Water compliance analyst AI.
            Analyze the submitted document against EPA compliance monitoring regulations.
            CHECK EACH OF THESE 18 COMPLIANCE AREAS. Rate each as COMPLIANT|NON_COMPLIANT|NEEDS_REVIEW|INSUFFICIENT_DATA:
            CLEAN WATER ACT: 1.NPDES_PERMIT 2.WATER_QUALITY_STANDARDS 3.DISCHARGE_REPORTING 4.PRETREATMENT_STANDARDS
            SAFE DRINKING WATER ACT: 5.MAX_CONTAMINANT_LEVELS 6.MONITORING_REPORTING 7.TREATMENT_TECHNIQUES
            EFFLUENT & DISCHARGE: 8.EFFLUENT_LIMITATIONS 9.TMDL_COMPLIANCE 10.STORMWATER_MGMT
            FACILITY & OPS: 11.RECORD_KEEPING 12.SELF_MONITORING 13.SPILL_PREVENTION 14.BEST_MGMT_PRACTICES
            REPORTING: 15.TIMELY_REPORTING 16.DATA_ACCURACY 17.PUBLIC_NOTIFICATION 18.CORRECTIVE_ACTIONS
            For each: status, evidence, risk_level(LOW|MEDIUM|HIGH|CRITICAL), recommendation.
            Also: overall_risk_score(1-100), priority_flag(ROUTINE|ELEVATED|URGENT|CRITICAL), summary, key_violations[], recommended_actions[].
            RESPOND IN VALID JSON ONLY. DOCUMENT: {document_text}
      Code:
        ZipFile: |
          import json,boto3,os,uuid
          from datetime import datetime
          s3c=boto3.client('s3')
          ddb=boto3.resource('dynamodb')
          br=boto3.client('bedrock-runtime')
          tx=boto3.client('textract')
          tbl=ddb.Table(os.environ['REPORTS_TABLE'])
          BKT=os.environ['DOCUMENTS_BUCKET']
          MDL=os.environ['BEDROCK_MODEL_ID']
          PROMPT=os.environ.get('EPA_PROMPT','')
          def handler(event,ctx):
              for rec in event.get('Records',[]):
                  key=rec['s3']['object']['key']
                  fn=key.split('/')[-1]
                  rid=str(uuid.uuid4())
                  tbl.put_item(Item={'reportId':rid,'fileName':fn,'s3Key':key,'status':'ANALYZING','submittedAt':datetime.utcnow().isoformat(),'submitterName':'S3 Upload','submitterEmail':'','facilityName':fn.replace('.txt','').replace('.pdf','').replace('-',' ').replace('_',' '),'reportType':'general','description':'Auto-submitted via S3','aiReview':{},'humanReview':{}})
                  try:
                      if key.lower().endswith(('.txt','.csv')):
                          text=s3c.get_object(Bucket=BKT,Key=key)['Body'].read().decode('utf-8')
                      else:
                          r=tx.detect_document_text(Document={'S3Object':{'Bucket':BKT,'Name':key}})
                          text='\n'.join(b.get('Text','') for b in r.get('Blocks',[]) if b['BlockType']=='LINE')
                  except Exception as e:
                      text=f'[Error: {e}]'
                  prompt=PROMPT.replace('{document_text}',text[:50000])
                  r=br.invoke_model(modelId=MDL,contentType='application/json',accept='application/json',body=json.dumps({"messages":[{"role":"user","content":prompt}],"max_tokens":4096,"temperature":0.1}))
                  c=json.loads(r['body'].read()).get('choices',[{}])[0].get('message',{}).get('content','')
                  try:
                      if '```json' in c:c=c.split('```json')[1].split('```')[0]
                      elif '```' in c:c=c.split('```')[1].split('```')[0]
                      ai=json.loads(c.strip())
                  except:
                      ai={"raw_analysis":c,"parse_error":True}
                  rs=ai.get('overall_risk_score',50);pr=ai.get('priority_flag','ROUTINE')
                  st='FLAGGED_FOR_REVIEW' if rs>70 or pr in('URGENT','CRITICAL') else 'NEEDS_REVIEW' if rs>40 or pr=='ELEVATED' else 'AI_APPROVED'
                  tbl.update_item(Key={'reportId':rid},UpdateExpression='SET #s=:s,aiReview=:ai,analyzedAt=:t,riskScore=:r',ExpressionAttributeNames={'#s':'status'},ExpressionAttributeValues={':s':st,':ai':ai,':t':datetime.utcnow().isoformat(),':r':rs})

  S3InvokeAutoAnalyzePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AutoAnalyzeFunction
      Action: 'lambda:InvokeFunction'
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::${ProjectName}-docs-${AWS::AccountId}'

  # ===================== S3 BUCKETS =====================

  DocumentsBucket:
    Type: AWS::S3::Bucket
    DependsOn: S3InvokeAutoAnalyzePermission
    Properties:
      BucketName: !Sub '${ProjectName}-docs-${AWS::AccountId}'
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
            Function: !GetAtt AutoAnalyzeFunction.Arn
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ['*']
            MaxAge: 3600
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveOldReports
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 365

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-web-${AWS::AccountId}'

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /error.html
            ResponseCode: 404
            ErrorCachingMinTTL: 10

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${WebsiteBucket}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ===================== DYNAMODB =====================

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-reports'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: submittedAt
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-submittedAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: submittedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ===================== IAM =====================

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject', 's3:ListBucket']
                Resource:
                  - !Sub 'arn:aws:s3:::${ProjectName}-docs-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${ProjectName}-docs-${AWS::AccountId}/*'
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['dynamodb:PutItem', 'dynamodb:GetItem', 'dynamodb:UpdateItem', 'dynamodb:Query', 'dynamodb:Scan']
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-reports'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-reports/index/*'
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['bedrock:InvokeModel', 'bedrock:InvokeModelWithResponseStream']
                Resource: '*'
        - PolicyName: LambdaSelfInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'lambda:InvokeFunction'
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*'
        - PolicyName: TextractAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['textract:DetectDocumentText', 'textract:AnalyzeDocument']
                Resource: '*'
        - PolicyName: SESAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['ses:SendEmail', 'ses:SendRawEmail']
                Resource: '*'

  # ===================== LAMBDA FUNCTIONS (Inline Code) =====================

  UploadFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-upload'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          REPORTS_TABLE: !Ref ReportsTable
      Code:
        ZipFile: |
          import json,boto3,uuid,os
          from datetime import datetime
          s3=boto3.client('s3')
          ddb=boto3.resource('dynamodb')
          tbl=ddb.Table(os.environ['REPORTS_TABLE'])
          BKT=os.environ['DOCUMENTS_BUCKET']
          H={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type,Authorization','Access-Control-Allow-Methods':'POST,OPTIONS'}
          def handler(event,context):
              if event.get('httpMethod')=='OPTIONS':
                  return{'statusCode':200,'headers':H,'body':''}
              try:
                  body=json.loads(event['body'])
                  rid=str(uuid.uuid4())
                  fn=body.get('fileName','document.pdf')
                  ft=body.get('fileType','application/pdf')
                  key=f"uploads/{rid}/{fn}"
                  url=s3.generate_presigned_url('put_object',Params={'Bucket':BKT,'Key':key,'ContentType':ft},ExpiresIn=3600)
                  tbl.put_item(Item={'reportId':rid,'fileName':fn,'s3Key':key,'status':'UPLOADED','submittedAt':datetime.utcnow().isoformat(),'submitterName':body.get('submitterName','Anonymous'),'submitterEmail':body.get('submitterEmail',''),'facilityName':body.get('facilityName',''),'reportType':body.get('reportType','general'),'description':body.get('description',''),'aiReview':{},'humanReview':{}})
                  return{'statusCode':200,'headers':H,'body':json.dumps({'reportId':rid,'uploadUrl':url,'message':'Upload URL generated.'})}
              except Exception as e:
                  return{'statusCode':500,'headers':H,'body':json.dumps({'error':str(e)})}

  AnalyzeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-analyze'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          REPORTS_TABLE: !Ref ReportsTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          EPA_PROMPT: >
            You are an EPA Office of Water compliance analyst AI.
            Analyze the submitted document against EPA compliance monitoring regulations.
            CHECK EACH OF THESE 18 COMPLIANCE AREAS. Rate each as COMPLIANT|NON_COMPLIANT|NEEDS_REVIEW|INSUFFICIENT_DATA:
            CLEAN WATER ACT: 1.NPDES_PERMIT 2.WATER_QUALITY_STANDARDS 3.DISCHARGE_REPORTING 4.PRETREATMENT_STANDARDS
            SAFE DRINKING WATER ACT: 5.MAX_CONTAMINANT_LEVELS 6.MONITORING_REPORTING 7.TREATMENT_TECHNIQUES
            EFFLUENT & DISCHARGE: 8.EFFLUENT_LIMITATIONS 9.TMDL_COMPLIANCE 10.STORMWATER_MGMT
            FACILITY & OPS: 11.RECORD_KEEPING 12.SELF_MONITORING 13.SPILL_PREVENTION 14.BEST_MGMT_PRACTICES
            REPORTING: 15.TIMELY_REPORTING 16.DATA_ACCURACY 17.PUBLIC_NOTIFICATION 18.CORRECTIVE_ACTIONS
            For each: status, evidence, risk_level(LOW|MEDIUM|HIGH|CRITICAL), recommendation.
            Also: overall_risk_score(1-100), priority_flag(ROUTINE|ELEVATED|URGENT|CRITICAL), summary, key_violations[], recommended_actions[].
            RESPOND IN VALID JSON ONLY. DOCUMENT: {document_text}
      Code:
        ZipFile: |
          import json,boto3,os
          from datetime import datetime
          s3=boto3.client('s3')
          ddb=boto3.resource('dynamodb')
          br=boto3.client('bedrock-runtime')
          tx=boto3.client('textract')
          lm=boto3.client('lambda')
          tbl=ddb.Table(os.environ['REPORTS_TABLE'])
          BKT=os.environ['DOCUMENTS_BUCKET']
          MDL=os.environ['BEDROCK_MODEL_ID']
          PROMPT=os.environ.get('EPA_PROMPT','Analyze for EPA compliance. Return JSON.')
          H={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type,Authorization','Access-Control-Allow-Methods':'POST,OPTIONS'}
          def extract(bucket,key):
              try:
                  if key.lower().endswith(('.txt','.csv')):
                      return s3.get_object(Bucket=bucket,Key=key)['Body'].read().decode('utf-8')
                  r=tx.detect_document_text(Document={'S3Object':{'Bucket':bucket,'Name':key}})
                  return '\n'.join(b.get('Text','') for b in r.get('Blocks',[]) if b['BlockType']=='LINE')
              except Exception as e:
                  return f'[Extraction error: {e}]'
          def run_ai(text):
              prompt=PROMPT.replace('{document_text}',text[:50000])
              r=br.invoke_model(modelId=MDL,contentType='application/json',accept='application/json',body=json.dumps({"messages":[{"role":"user","content":prompt}],"max_tokens":4096,"temperature":0.1}))
              c=json.loads(r['body'].read()).get('choices',[{}])[0].get('message',{}).get('content','')
              try:
                  if '```json' in c:c=c.split('```json')[1].split('```')[0]
                  elif '```' in c:c=c.split('```')[1].split('```')[0]
                  return json.loads(c.strip())
              except:
                  return{"raw_analysis":c,"parse_error":True}
          def handler(event,context):
              if event.get('httpMethod')=='OPTIONS':
                  return{'statusCode':200,'headers':H,'body':''}
              if event.get('async'):
                  rid=event['reportId']
                  rpt=tbl.get_item(Key={'reportId':rid})['Item']
                  text=extract(BKT,rpt['s3Key'])
                  ai=run_ai(text)
                  rs=ai.get('overall_risk_score',50);pr=ai.get('priority_flag','ROUTINE')
                  st='FLAGGED_FOR_REVIEW' if rs>70 or pr in('URGENT','CRITICAL') else 'NEEDS_REVIEW' if rs>40 or pr=='ELEVATED' else 'AI_APPROVED'
                  tbl.update_item(Key={'reportId':rid},UpdateExpression='SET #s=:s,aiReview=:ai,analyzedAt=:t,riskScore=:r',ExpressionAttributeNames={'#s':'status'},ExpressionAttributeValues={':s':st,':ai':ai,':t':datetime.utcnow().isoformat(),':r':rs})
                  return
              try:
                  body=json.loads(event['body']);rid=body['reportId']
                  tbl.update_item(Key={'reportId':rid},UpdateExpression='SET #s=:s',ExpressionAttributeNames={'#s':'status'},ExpressionAttributeValues={':s':'ANALYZING'})
                  lm.invoke(FunctionName=context.function_name,InvocationType='Event',Payload=json.dumps({'async':True,'reportId':rid}))
                  return{'statusCode':200,'headers':H,'body':json.dumps({'reportId':rid,'status':'ANALYZING','message':'Analysis started. Check review dashboard for results.'})}
              except Exception as e:
                  return{'statusCode':500,'headers':H,'body':json.dumps({'error':str(e)})}

  ReviewFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-review'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          REPORTS_TABLE: !Ref ReportsTable
          NOTIFY_FUNCTION: !Sub '${ProjectName}-notify'
      Code:
        ZipFile: |
          import json,boto3,os
          from datetime import datetime
          from boto3.dynamodb.conditions import Key,Attr
          ddb=boto3.resource('dynamodb')
          lm=boto3.client('lambda')
          tbl=ddb.Table(os.environ['REPORTS_TABLE'])
          NF=os.environ.get('NOTIFY_FUNCTION','')
          H={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type,Authorization','Access-Control-Allow-Methods':'GET,PUT,OPTIONS'}
          def handler(event,context):
              if event.get('httpMethod')=='OPTIONS':
                  return{'statusCode':200,'headers':H,'body':''}
              method=event.get('httpMethod','GET')
              params=event.get('queryStringParameters') or {}
              try:
                  if method=='GET' and 'reportId' not in params:
                      sf=params.get('status','FLAGGED_FOR_REVIEW')
                      if sf=='ALL':
                          r=tbl.scan()
                      else:
                          r=tbl.query(IndexName='status-submittedAt-index',KeyConditionExpression=Key('status').eq(sf))
                      items=r.get('Items',[])
                      search=params.get('search','').lower()
                      if search:
                          items=[i for i in items if search in (i.get('facilityName','')+''+i.get('fileName','')).lower()]
                      fd=params.get('fromDate','');td=params.get('toDate','')
                      if fd:
                          items=[i for i in items if i.get('submittedAt','')>=fd]
                      if td:
                          items=[i for i in items if i.get('submittedAt','')<=td+'T23:59:59']
                      return{'statusCode':200,'headers':H,'body':json.dumps({'reports':items},default=str)}
                  elif method=='GET' and 'reportId' in params:
                      item=tbl.get_item(Key={'reportId':params['reportId']}).get('Item',{})
                      return{'statusCode':200,'headers':H,'body':json.dumps({'report':item},default=str)}
                  elif method=='PUT':
                      body=json.loads(event['body'])
                      rid=body['reportId']
                      if 'assign' in body:
                          tbl.update_item(Key={'reportId':rid},UpdateExpression='SET assignedTo=:a',ExpressionAttributeValues={':a':body['assign']})
                          return{'statusCode':200,'headers':H,'body':json.dumps({'reportId':rid,'message':'Assigned to '+body['assign']})}
                      dec=body['decision'];notes=body.get('notes','');rn=body.get('reviewerName','Unknown')
                      tbl.update_item(Key={'reportId':rid},UpdateExpression='SET #s=:s,humanReview=:hr,reviewedAt=:t',ExpressionAttributeNames={'#s':'status'},ExpressionAttributeValues={':s':f'HUMAN_{dec}',':hr':{'decision':dec,'notes':notes,'reviewerName':rn,'reviewedAt':datetime.utcnow().isoformat()},':t':datetime.utcnow().isoformat()})
                      try:lm.invoke(FunctionName=NF,InvocationType='Event',Payload=json.dumps({'reportId':rid,'decision':dec,'notes':notes,'reviewer':rn}))
                      except:pass
                      return{'statusCode':200,'headers':H,'body':json.dumps({'reportId':rid,'status':f'HUMAN_{dec}','message':f'Report {dec.lower()} by {rn}'})}
                  return{'statusCode':400,'headers':H,'body':json.dumps({'error':'Invalid request'})}
              except Exception as e:
                  return{'statusCode':500,'headers':H,'body':json.dumps({'error':str(e)})}

  # ===================== NEW: EMAIL NOTIFICATION FUNCTION =====================

  NotifyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-notify'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          REPORTS_TABLE: !Ref ReportsTable
      Code:
        ZipFile: |
          import json,boto3,os
          ses=boto3.client('ses')
          ddb=boto3.resource('dynamodb')
          tbl=ddb.Table(os.environ['REPORTS_TABLE'])
          def handler(event,ctx):
              rid=event.get('reportId','')
              dec=event.get('decision','')
              notes=event.get('notes','')
              reviewer=event.get('reviewer','')
              try:
                  rpt=tbl.get_item(Key={'reportId':rid}).get('Item',{})
                  email=rpt.get('submitterEmail','')
                  if not email:return
                  fac=rpt.get('facilityName','Unknown')
                  rs=rpt.get('riskScore',0)
                  subj=f'EPA Compliance Review: {fac} - {dec}'
                  body=f'Dear {rpt.get("submitterName","Submitter")},\n\nYour compliance report for {fac} has been reviewed.\n\nDecision: {dec}\nRisk Score: {rs}/100\nReviewer: {reviewer}\nNotes: {notes or "None"}\n\nReport ID: {rid}\n\n- EPA Office of Water Compliance System'
                  ses.send_email(Source=email,Destination={'ToAddresses':[email]},Message={'Subject':{'Data':subj},'Body':{'Text':{'Data':body}}})
              except Exception as e:
                  print(f'Notify error: {e}')

  # ===================== NEW: AI CHATBOT FUNCTION =====================

  ChatFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-chat'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          REPORTS_TABLE: !Ref ReportsTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Code:
        ZipFile: |
          import json,boto3,os
          from decimal import Decimal
          ddb=boto3.resource('dynamodb')
          br=boto3.client('bedrock-runtime')
          tbl=ddb.Table(os.environ['REPORTS_TABLE'])
          MDL=os.environ['BEDROCK_MODEL_ID']
          H={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type,Authorization','Access-Control-Allow-Methods':'POST,OPTIONS'}
          SYS="You are an EPA compliance assistant with access to the reports database. Answer based on the data provided. Be concise."
          class DE(json.JSONEncoder):
              def default(self,o):
                  if isinstance(o,Decimal):return int(o) if o%1==0 else float(o)
                  return super().default(o)
          def get_context():
              r=tbl.scan(ProjectionExpression='reportId,facilityName,#s,riskScore,submittedAt',ExpressionAttributeNames={'#s':'status'})
              items=r.get('Items',[])
              flagged=sorted([i for i in items if i.get('status')=='FLAGGED_FOR_REVIEW'],key=lambda x:int(x.get('riskScore',0)),reverse=True)[:5]
              summary=f"Total reports:{len(items)}. "
              summary+=f"Flagged:{len([i for i in items if i.get('status')=='FLAGGED_FOR_REVIEW'])}. "
              summary+=f"Top flagged: "+"; ".join(f"{i.get('facilityName','')}(risk:{i.get('riskScore','')})" for i in flagged)
              return summary
          def handler(event,ctx):
              if event.get('httpMethod')=='OPTIONS':
                  return{'statusCode':200,'headers':H,'body':''}
              try:
                  body=json.loads(event['body'])
                  q=body.get('question','')
                  rid=body.get('reportId','')
                  if rid:
                      rpt=tbl.get_item(Key={'reportId':rid}).get('Item',{})
                      ctx_text=f"Report: {rpt.get('facilityName','')} Status={rpt.get('status','')} Risk={rpt.get('riskScore','')}"
                  else:
                      ctx_text=get_context()
                  prompt=f"{SYS}\nData: {ctx_text}\nQuestion: {q}"
                  r=br.invoke_model(modelId=MDL,contentType='application/json',accept='application/json',body=json.dumps({"messages":[{"role":"user","content":prompt}],"max_tokens":512,"temperature":0.2}))
                  ans=json.loads(r['body'].read()).get('choices',[{}])[0].get('message',{}).get('content','No response')
                  return{'statusCode':200,'headers':H,'body':json.dumps({'answer':ans})}
              except Exception as e:
                  return{'statusCode':500,'headers':H,'body':json.dumps({'error':str(e)})}  # ===================== NEW: STATS/ANALYTICS FUNCTION =====================

  StatsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-stats'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          REPORTS_TABLE: !Ref ReportsTable
      Code:
        ZipFile: |
          import json,boto3,os
          from collections import Counter,defaultdict
          from datetime import datetime,timedelta
          ddb=boto3.resource('dynamodb')
          tbl=ddb.Table(os.environ['REPORTS_TABLE'])
          H={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type,Authorization','Access-Control-Allow-Methods':'GET,OPTIONS'}
          def handler(event,ctx):
              if event.get('httpMethod')=='OPTIONS':
                  return{'statusCode':200,'headers':H,'body':''}
              try:
                  qp=event.get('queryStringParameters') or {}
                  days=qp.get('days')
                  r=tbl.scan()
                  items=r.get('Items',[])
                  if days:
                      cutoff=(datetime.utcnow()-timedelta(days=int(days))).isoformat()
                      items=[i for i in items if i.get('submittedAt','')>=cutoff]
                  total=len(items)
                  by_status=Counter(i.get('status','UNKNOWN') for i in items)
                  flagged=by_status.get('FLAGGED_FOR_REVIEW',0)
                  needs=by_status.get('NEEDS_REVIEW',0)
                  approved=by_status.get('AI_APPROVED',0)+by_status.get('HUMAN_APPROVED',0)
                  scores=[int(i.get('riskScore',0)) for i in items if i.get('riskScore')]
                  avg_risk=sum(scores)//max(len(scores),1)
                  bins=[('0-20',0),('21-40',0),('41-60',0),('61-80',0),('81-100',0)]
                  for s in scores:
                      idx=min(s//20,4) if s>0 else 0
                      bins[idx]=(bins[idx][0],bins[idx][1]+1)
                  risk_dist=[{'range':b[0],'count':b[1]} for b in bins]
                  viols=Counter()
                  for i in items:
                      ai=i.get('aiReview',{})
                      if isinstance(ai,dict):
                          for v in ai.get('key_violations',[]):viols[v]+=1
                  top_v=[{'name':k,'count':v} for k,v in viols.most_common(8)]
                  trend=defaultdict(int)
                  for i in items:
                      d=i.get('submittedAt','')[:10]
                      if d:trend[d]+=1
                  trend_data=sorted([{'date':k,'count':v} for k,v in trend.items()],key=lambda x:x['date'])[-14:]
                  return{'statusCode':200,'headers':H,'body':json.dumps({'total':total,'flagged':flagged,'needsReview':needs,'approved':approved,'avgRisk':avg_risk,'byStatus':dict(by_status),'riskDistribution':risk_dist,'topViolations':top_v,'trend':trend_data})}
              except Exception as e:
                  return{'statusCode':500,'headers':H,'body':json.dumps({'error':str(e)})}  # ===================== NEW: EXPORT/PDF FUNCTION =====================

  ExportFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-export'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          REPORTS_TABLE: !Ref ReportsTable
      Code:
        ZipFile: |
          import json,boto3,os
          ddb=boto3.resource('dynamodb')
          tbl=ddb.Table(os.environ['REPORTS_TABLE'])
          H={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type','Access-Control-Allow-Methods':'GET,OPTIONS','Content-Type':'text/html'}
          def handler(event,ctx):
              if event.get('httpMethod')=='OPTIONS':
                  return{'statusCode':200,'headers':H,'body':''}
              params=event.get('queryStringParameters') or {}
              rid=params.get('reportId','')
              if not rid:return{'statusCode':400,'headers':H,'body':'Missing reportId'}
              try:
                  rpt=tbl.get_item(Key={'reportId':rid}).get('Item',{})
                  ai=rpt.get('aiReview',{})
                  hr=rpt.get('humanReview',{})
                  rs=rpt.get('riskScore',0)
                  color='#dc2626' if int(rs)>70 else '#d97706' if int(rs)>40 else '#059669'
                  viols=''.join(f'<li>{v}</li>' for v in (ai.get('key_violations',[]) or []))or'<li>None</li>'
                  acts=''.join(f'<li>{a}</li>' for a in (ai.get('recommended_actions',[]) or []))or'<li>None</li>'
                  html=f'<!DOCTYPE html><html><head><title>EPA Report - {rpt.get("facilityName","")}</title><style>body{{font-family:Arial;padding:2rem;max-width:900px;margin:auto}}h1{{color:#1a365d}}table{{width:100%;border-collapse:collapse}}th,td{{border:1px solid #ddd;padding:8px;text-align:left}}th{{background:#f0f4f8}}.risk{{font-size:2rem;color:{color};font-weight:bold}}</style></head><body><h1>EPA Compliance Review Report</h1><p><strong>Facility:</strong> {rpt.get("facilityName","")}</p><p><strong>Report ID:</strong> {rid}</p><p><strong>Submitted:</strong> {rpt.get("submittedAt","")}</p><p><strong>Status:</strong> {rpt.get("status","")}</p><p><strong>Risk Score:</strong> <span class="risk">{rs}/100</span></p><p><strong>Priority:</strong> {ai.get("priority_flag","N/A")}</p><h2>AI Analysis Summary</h2><p>{ai.get("summary","Pending")}</p><h2>Key Violations</h2><ul>{viols}</ul><h2>Recommended Actions</h2><ul>{acts}</ul>'
                  if hr:html+=f'<h2>Human Review</h2><p><strong>Decision:</strong> {hr.get("decision","")}</p><p><strong>Reviewer:</strong> {hr.get("reviewerName","")}</p><p><strong>Notes:</strong> {hr.get("notes","None")}</p>'
                  html+='<hr><p style="color:#666;font-size:0.8rem">Generated by EPA Office of Water AI Compliance System</p><script>window.print()</script></body></html>'
                  return{'statusCode':200,'headers':H,'body':html}
              except Exception as e:
                  return{'statusCode':500,'headers':H,'body':f'Error: {e}'}

