AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EPA Office of Water - Citizen Compliance Report Submission & AI Review System.
  Uses Amazon Bedrock (Mistral) for automated compliance checking against EPA regulations.
  All Lambda code is inline - no external S3 bucket needed. Just deploy this template.

Parameters:
  ProjectName:
    Type: String
    Default: epa-compliance-review
    Description: Project name prefix for all resources

  BedrockModelId:
    Type: String
    Default: mistral.mistral-large-2402-v1:0
    Description: Bedrock model ID for Mistral

  NotificationEmail:
    Type: String
    Default: ''
    Description: Email for flagged-report notifications (leave blank to skip)

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, '']]

Resources:

  # ===================== S3 AUTO-ANALYZE (bulk upload trigger) =====================

  AutoAnalyzeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-auto-analyze'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Sub '${ProjectName}-docs-${AWS::AccountId}'
          REPORTS_TABLE: !Sub '${ProjectName}-reports'
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          EPA_PROMPT: >
            You are an EPA Office of Water compliance analyst AI.
            Analyze the submitted document against EPA compliance monitoring regulations.
            CHECK EACH OF THESE 18 COMPLIANCE AREAS. Rate each as COMPLIANT|NON_COMPLIANT|NEEDS_REVIEW|INSUFFICIENT_DATA:
            CLEAN WATER ACT: 1.NPDES_PERMIT 2.WATER_QUALITY_STANDARDS 3.DISCHARGE_REPORTING 4.PRETREATMENT_STANDARDS
            SAFE DRINKING WATER ACT: 5.MAX_CONTAMINANT_LEVELS 6.MONITORING_REPORTING 7.TREATMENT_TECHNIQUES
            EFFLUENT & DISCHARGE: 8.EFFLUENT_LIMITATIONS 9.TMDL_COMPLIANCE 10.STORMWATER_MGMT
            FACILITY & OPS: 11.RECORD_KEEPING 12.SELF_MONITORING 13.SPILL_PREVENTION 14.BEST_MGMT_PRACTICES
            REPORTING: 15.TIMELY_REPORTING 16.DATA_ACCURACY 17.PUBLIC_NOTIFICATION 18.CORRECTIVE_ACTIONS
            For each: status, evidence, risk_level(LOW|MEDIUM|HIGH|CRITICAL), recommendation.
            Also: overall_risk_score(1-100), priority_flag(ROUTINE|ELEVATED|URGENT|CRITICAL), summary, key_violations[], recommended_actions[].
            RESPOND IN VALID JSON ONLY. DOCUMENT: {document_text}
      Code:
        ZipFile: |
          import json,boto3,os,uuid
          from datetime import datetime
          s3c=boto3.client('s3')
          ddb=boto3.resource('dynamodb')
          br=boto3.client('bedrock-runtime')
          tx=boto3.client('textract')
          tbl=ddb.Table(os.environ['REPORTS_TABLE'])
          BKT=os.environ['DOCUMENTS_BUCKET']
          MDL=os.environ['BEDROCK_MODEL_ID']
          PROMPT=os.environ.get('EPA_PROMPT','')
          def handler(event,ctx):
              for rec in event.get('Records',[]):
                  key=rec['s3']['object']['key']
                  fn=key.split('/')[-1]
                  rid=str(uuid.uuid4())
                  tbl.put_item(Item={'reportId':rid,'fileName':fn,'s3Key':key,'status':'ANALYZING','submittedAt':datetime.utcnow().isoformat(),'submitterName':'S3 Upload','submitterEmail':'','facilityName':fn.replace('.txt','').replace('.pdf','').replace('-',' ').replace('_',' '),'reportType':'general','description':'Auto-submitted via S3','aiReview':{},'humanReview':{}})
                  try:
                      if key.lower().endswith(('.txt','.csv')):
                          text=s3c.get_object(Bucket=BKT,Key=key)['Body'].read().decode('utf-8')
                      else:
                          r=tx.detect_document_text(Document={'S3Object':{'Bucket':BKT,'Name':key}})
                          text='\n'.join(b.get('Text','') for b in r.get('Blocks',[]) if b['BlockType']=='LINE')
                  except Exception as e:
                      text=f'[Error: {e}]'
                  prompt=PROMPT.replace('{document_text}',text[:50000])
                  r=br.invoke_model(modelId=MDL,contentType='application/json',accept='application/json',body=json.dumps({"messages":[{"role":"user","content":prompt}],"max_tokens":4096,"temperature":0.1}))
                  c=json.loads(r['body'].read()).get('choices',[{}])[0].get('message',{}).get('content','')
                  try:
                      if '```json' in c:c=c.split('```json')[1].split('```')[0]
                      elif '```' in c:c=c.split('```')[1].split('```')[0]
                      ai=json.loads(c.strip())
                  except:
                      ai={"raw_analysis":c,"parse_error":True}
                  rs=ai.get('overall_risk_score',50);pr=ai.get('priority_flag','ROUTINE')
                  st='FLAGGED_FOR_REVIEW' if rs>70 or pr in('URGENT','CRITICAL') else 'NEEDS_REVIEW' if rs>40 or pr=='ELEVATED' else 'AI_APPROVED'
                  tbl.update_item(Key={'reportId':rid},UpdateExpression='SET #s=:s,aiReview=:ai,analyzedAt=:t,riskScore=:r',ExpressionAttributeNames={'#s':'status'},ExpressionAttributeValues={':s':st,':ai':ai,':t':datetime.utcnow().isoformat(),':r':rs})

  S3InvokeAutoAnalyzePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AutoAnalyzeFunction
      Action: 'lambda:InvokeFunction'
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::${ProjectName}-docs-${AWS::AccountId}'

  # ===================== S3 BUCKETS =====================

  DocumentsBucket:
    Type: AWS::S3::Bucket
    DependsOn: S3InvokeAutoAnalyzePermission
    Properties:
      BucketName: !Sub '${ProjectName}-docs-${AWS::AccountId}'
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
            Function: !GetAtt AutoAnalyzeFunction.Arn
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ['*']
            MaxAge: 3600
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveOldReports
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 365

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-web-${AWS::AccountId}'

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /error.html
            ResponseCode: 404
            ErrorCachingMinTTL: 10

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${WebsiteBucket}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ===================== DYNAMODB =====================

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-reports'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: submittedAt
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-submittedAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: submittedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ===================== IAM =====================

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject', 's3:ListBucket']
                Resource:
                  - !Sub 'arn:aws:s3:::${ProjectName}-docs-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${ProjectName}-docs-${AWS::AccountId}/*'
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['dynamodb:PutItem', 'dynamodb:GetItem', 'dynamodb:UpdateItem', 'dynamodb:Query', 'dynamodb:Scan']
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-reports'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-reports/index/*'
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['bedrock:InvokeModel', 'bedrock:InvokeModelWithResponseStream']
                Resource: '*'
        - PolicyName: LambdaSelfInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'lambda:InvokeFunction'
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*'
        - PolicyName: TextractAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['textract:DetectDocumentText', 'textract:AnalyzeDocument']
                Resource: '*'

  # ===================== LAMBDA FUNCTIONS (Inline Code) =====================

  UploadFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-upload'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          REPORTS_TABLE: !Ref ReportsTable
      Code:
        ZipFile: |
          import json,boto3,uuid,os
          from datetime import datetime
          s3=boto3.client('s3')
          ddb=boto3.resource('dynamodb')
          tbl=ddb.Table(os.environ['REPORTS_TABLE'])
          BKT=os.environ['DOCUMENTS_BUCKET']
          H={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type,Authorization','Access-Control-Allow-Methods':'POST,OPTIONS'}
          def handler(event,context):
              if event.get('httpMethod')=='OPTIONS':
                  return{'statusCode':200,'headers':H,'body':''}
              try:
                  body=json.loads(event['body'])
                  rid=str(uuid.uuid4())
                  fn=body.get('fileName','document.pdf')
                  ft=body.get('fileType','application/pdf')
                  key=f"uploads/{rid}/{fn}"
                  url=s3.generate_presigned_url('put_object',Params={'Bucket':BKT,'Key':key,'ContentType':ft},ExpiresIn=3600)
                  tbl.put_item(Item={'reportId':rid,'fileName':fn,'s3Key':key,'status':'UPLOADED','submittedAt':datetime.utcnow().isoformat(),'submitterName':body.get('submitterName','Anonymous'),'submitterEmail':body.get('submitterEmail',''),'facilityName':body.get('facilityName',''),'reportType':body.get('reportType','general'),'description':body.get('description',''),'aiReview':{},'humanReview':{}})
                  return{'statusCode':200,'headers':H,'body':json.dumps({'reportId':rid,'uploadUrl':url,'message':'Upload URL generated.'})}
              except Exception as e:
                  return{'statusCode':500,'headers':H,'body':json.dumps({'error':str(e)})}

  AnalyzeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-analyze'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          REPORTS_TABLE: !Ref ReportsTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          EPA_PROMPT: >
            You are an EPA Office of Water compliance analyst AI.
            Analyze the submitted document against EPA compliance monitoring regulations.
            CHECK EACH OF THESE 18 COMPLIANCE AREAS. Rate each as COMPLIANT|NON_COMPLIANT|NEEDS_REVIEW|INSUFFICIENT_DATA:
            CLEAN WATER ACT: 1.NPDES_PERMIT 2.WATER_QUALITY_STANDARDS 3.DISCHARGE_REPORTING 4.PRETREATMENT_STANDARDS
            SAFE DRINKING WATER ACT: 5.MAX_CONTAMINANT_LEVELS 6.MONITORING_REPORTING 7.TREATMENT_TECHNIQUES
            EFFLUENT & DISCHARGE: 8.EFFLUENT_LIMITATIONS 9.TMDL_COMPLIANCE 10.STORMWATER_MGMT
            FACILITY & OPS: 11.RECORD_KEEPING 12.SELF_MONITORING 13.SPILL_PREVENTION 14.BEST_MGMT_PRACTICES
            REPORTING: 15.TIMELY_REPORTING 16.DATA_ACCURACY 17.PUBLIC_NOTIFICATION 18.CORRECTIVE_ACTIONS
            For each: status, evidence, risk_level(LOW|MEDIUM|HIGH|CRITICAL), recommendation.
            Also: overall_risk_score(1-100), priority_flag(ROUTINE|ELEVATED|URGENT|CRITICAL), summary, key_violations[], recommended_actions[].
            RESPOND IN VALID JSON ONLY. DOCUMENT: {document_text}
      Code:
        ZipFile: |
          import json,boto3,os
          from datetime import datetime
          s3=boto3.client('s3')
          ddb=boto3.resource('dynamodb')
          br=boto3.client('bedrock-runtime')
          tx=boto3.client('textract')
          lm=boto3.client('lambda')
          tbl=ddb.Table(os.environ['REPORTS_TABLE'])
          BKT=os.environ['DOCUMENTS_BUCKET']
          MDL=os.environ['BEDROCK_MODEL_ID']
          PROMPT=os.environ.get('EPA_PROMPT','Analyze for EPA compliance. Return JSON.')
          H={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type,Authorization','Access-Control-Allow-Methods':'POST,OPTIONS'}
          def extract(bucket,key):
              try:
                  if key.lower().endswith(('.txt','.csv')):
                      return s3.get_object(Bucket=bucket,Key=key)['Body'].read().decode('utf-8')
                  r=tx.detect_document_text(Document={'S3Object':{'Bucket':bucket,'Name':key}})
                  return '\n'.join(b.get('Text','') for b in r.get('Blocks',[]) if b['BlockType']=='LINE')
              except Exception as e:
                  return f'[Extraction error: {e}]'
          def run_ai(text):
              prompt=PROMPT.replace('{document_text}',text[:50000])
              r=br.invoke_model(modelId=MDL,contentType='application/json',accept='application/json',body=json.dumps({"messages":[{"role":"user","content":prompt}],"max_tokens":4096,"temperature":0.1}))
              c=json.loads(r['body'].read()).get('choices',[{}])[0].get('message',{}).get('content','')
              try:
                  if '```json' in c:c=c.split('```json')[1].split('```')[0]
                  elif '```' in c:c=c.split('```')[1].split('```')[0]
                  return json.loads(c.strip())
              except:
                  return{"raw_analysis":c,"parse_error":True}
          def handler(event,context):
              if event.get('httpMethod')=='OPTIONS':
                  return{'statusCode':200,'headers':H,'body':''}
              if event.get('async'):
                  rid=event['reportId']
                  rpt=tbl.get_item(Key={'reportId':rid})['Item']
                  text=extract(BKT,rpt['s3Key'])
                  ai=run_ai(text)
                  rs=ai.get('overall_risk_score',50);pr=ai.get('priority_flag','ROUTINE')
                  st='FLAGGED_FOR_REVIEW' if rs>70 or pr in('URGENT','CRITICAL') else 'NEEDS_REVIEW' if rs>40 or pr=='ELEVATED' else 'AI_APPROVED'
                  tbl.update_item(Key={'reportId':rid},UpdateExpression='SET #s=:s,aiReview=:ai,analyzedAt=:t,riskScore=:r',ExpressionAttributeNames={'#s':'status'},ExpressionAttributeValues={':s':st,':ai':ai,':t':datetime.utcnow().isoformat(),':r':rs})
                  return
              try:
                  body=json.loads(event['body']);rid=body['reportId']
                  tbl.update_item(Key={'reportId':rid},UpdateExpression='SET #s=:s',ExpressionAttributeNames={'#s':'status'},ExpressionAttributeValues={':s':'ANALYZING'})
                  lm.invoke(FunctionName=context.function_name,InvocationType='Event',Payload=json.dumps({'async':True,'reportId':rid}))
                  return{'statusCode':200,'headers':H,'body':json.dumps({'reportId':rid,'status':'ANALYZING','message':'Analysis started. Check review dashboard for results.'})}
              except Exception as e:
                  return{'statusCode':500,'headers':H,'body':json.dumps({'error':str(e)})}

  ReviewFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-review'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          REPORTS_TABLE: !Ref ReportsTable
      Code:
        ZipFile: |
          import json,boto3,os
          from datetime import datetime
          from boto3.dynamodb.conditions import Key
          ddb=boto3.resource('dynamodb')
          tbl=ddb.Table(os.environ['REPORTS_TABLE'])
          H={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type,Authorization','Access-Control-Allow-Methods':'GET,PUT,OPTIONS'}
          def handler(event,context):
              if event.get('httpMethod')=='OPTIONS':
                  return{'statusCode':200,'headers':H,'body':''}
              method=event.get('httpMethod','GET')
              params=event.get('queryStringParameters') or {}
              try:
                  if method=='GET' and 'reportId' not in params:
                      sf=params.get('status','FLAGGED_FOR_REVIEW')
                      if sf=='ALL':
                          r=tbl.scan()
                      else:
                          r=tbl.query(IndexName='status-submittedAt-index',KeyConditionExpression=Key('status').eq(sf))
                      return{'statusCode':200,'headers':H,'body':json.dumps({'reports':r.get('Items',[])},default=str)}
                  elif method=='GET' and 'reportId' in params:
                      item=tbl.get_item(Key={'reportId':params['reportId']}).get('Item',{})
                      return{'statusCode':200,'headers':H,'body':json.dumps({'report':item},default=str)}
                  elif method=='PUT':
                      body=json.loads(event['body'])
                      rid=body['reportId'];dec=body['decision']
                      notes=body.get('notes','');rn=body.get('reviewerName','Unknown')
                      tbl.update_item(Key={'reportId':rid},UpdateExpression='SET #s=:s,humanReview=:hr,reviewedAt=:t',ExpressionAttributeNames={'#s':'status'},ExpressionAttributeValues={':s':f'HUMAN_{dec}',':hr':{'decision':dec,'notes':notes,'reviewerName':rn,'reviewedAt':datetime.utcnow().isoformat()},':t':datetime.utcnow().isoformat()})
                      return{'statusCode':200,'headers':H,'body':json.dumps({'reportId':rid,'status':f'HUMAN_{dec}','message':f'Report {dec.lower()} by {rn}'})}
                  return{'statusCode':400,'headers':H,'body':json.dumps({'error':'Invalid request'})}
              except Exception as e:
                  return{'statusCode':500,'headers':H,'body':json.dumps({'error':str(e)})}

  # ===================== AUTO-DEPLOY FRONTEND =====================

  FrontendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-deploy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:PutObject', 's3:DeleteObject']
                Resource: !Sub '${WebsiteBucket.Arn}/*'

  FrontendDeployFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-deploy-frontend'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FrontendDeployRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        ZipFile: |
          import json,boto3,base64,gzip,urllib.request
          s3=boto3.client('s3')
          def handler(event,ctx):
              try:
                  p=event['ResourceProperties']
                  bkt=p['Bucket'];api=p.get('ApiUrl','')
                  if event['RequestType'] in ('Create','Update'):
                      for f in p.get('Files',[]):
                          data=gzip.decompress(base64.b64decode(f['Data'])).decode('utf-8')
                          if api:data=data.replace('%%API_URL%%',api)
                          s3.put_object(Bucket=bkt,Key=f['Key'],Body=data.encode('utf-8'),ContentType=f['CT'])
                  send(event,ctx,'SUCCESS',{})
              except Exception as e:
                  print(e)
                  send(event,ctx,'FAILED',{'Error':str(e)})
          def send(event,ctx,status,data):
              body=json.dumps({'Status':status,'Reason':'See CloudWatch','UniqueId':'id','StackId':event['StackId'],'RequestId':event['RequestId'],'LogicalResourceId':event['LogicalResourceId'],'PhysicalResourceId':ctx.log_stream_name,'Data':data}).encode()
              req=urllib.request.Request(event['ResponseURL'],data=body,headers={'Content-Type':'','Content-Length':len(body)},method='PUT')
              urllib.request.urlopen(req)


  # ===================== API GATEWAY =====================

  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-api'
      Description: EPA Compliance Report Submission & Review API

  UploadResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: upload

  UploadPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref UploadResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UploadFunction.Arn}/invocations'

  UploadOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref UploadResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  AnalyzeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: analyze

  AnalyzePost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref AnalyzeResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AnalyzeFunction.Arn}/invocations'

  AnalyzeOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref AnalyzeResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ReviewResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: review

  ReviewGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ReviewResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ReviewFunction.Arn}/invocations'

  ReviewPut:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ReviewResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ReviewFunction.Arn}/invocations'

  ReviewOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ReviewResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Lambda Invoke Permissions
  UploadLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadFunction
      Action: 'lambda:InvokeFunction'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*'

  AnalyzeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AnalyzeFunction
      Action: 'lambda:InvokeFunction'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*'

  ReviewLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReviewFunction
      Action: 'lambda:InvokeFunction'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*'

  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UploadPost
      - AnalyzePost
      - ReviewGet
      - ReviewPut
      - UploadOptions
      - AnalyzeOptions
      - ReviewOptions
    Properties:
      RestApiId: !Ref ApiGateway
      Description: 'Deployment 1777485953 with CORS MOCK OPTIONS'

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ApiGateway
      DeploymentId: !Ref ApiDeployment
      StageName: prod

  FrontendDeployment:
    Type: Custom::FrontendDeploy
    DependsOn: [WebsiteBucket, WebsiteBucketPolicy, ApiStage]
    Properties:
      ServiceToken: !GetAtt FrontendDeployFunction.Arn
      Bucket: !Ref WebsiteBucket
      ApiUrl: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod'
      Files:
